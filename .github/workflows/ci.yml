name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      # The workflows are the one part of this repository that nothing else
      # checks: a mistake in them is found by pushing, and the push is the thing
      # being checked.
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh write-zip.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.18.2

      # Strict, with every optional error class the version offers. This code
      # decides what lands on a disk and what a patch binds to, so a None or a
      # width crossing a boundary is exactly what this catches. The settings live
      # in pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy
        env:
          MYPYPATH: n64-video-interface-python/src

  test:
    name: ${{ matrix.label }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11", label: Linux x86_64 }
          - { os: ubuntu-latest, python: "3.12", label: Linux x86_64 }
          - { os: ubuntu-latest, python: "3.13", label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, python: "3.13", label: Linux arm64 }
          - { os: macos-15-intel, python: "3.13", label: macOS Intel }
          - { os: macos-latest, python: "3.13", label: macOS Apple silicon }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.3.4 pytest-cov==6.0.0

      # No ROMs, no patches, no cached catalogue and no network. That is the
      # state a contributor clones into, and the suite has to pass there or the
      # project cannot be worked on by anybody who does not already own a
      # collection. Tests that need those files carry a marker and skip.
      - name: Run the suite against nothing but the repository
        run: python -m pytest -q -p no:randomly

  platform:
    name: Installed on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux x86_64, device: umount }
          - { os: ubuntu-24.04-arm, label: Linux arm64, device: umount }
          - { os: macos-15-intel, label: macOS Intel, device: diskutil }
          - { os: macos-latest, label: macOS Apple silicon, device: diskutil }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Running the suite from a checkout proves the code is portable. It does
      # not prove the thing a user gets is, so this installs the package the way
      # they would and drives it through its own entry point.
      - name: Install it the way a user would
        run: python -m pip install --disable-pip-version-check .

      - name: The command line runs
        run: |
          z64kit --help
          z64kit doctor

      - name: The disk writer reaches for this platform's tools
        env:
          EXPECTED: ${{ matrix.device }}
        run: |
          python - <<'CHECK'
          import os
          import sys
          from z64kit import burn

          device = burn.Device(
              node="d", size=0, media="", removable=True, external=True,
              virtual=False, block="/dev/d", raw="/dev/d",
          )
          wanted = os.environ["EXPECTED"]
          chosen = " ".join(burn.unmount_command(device) + burn.eject_command(device))
          print(f"on {sys.platform}: {chosen}")
          if wanted not in chosen:
              print(f"::error title=Wrong tool::expected {wanted}")
              raise SystemExit(1)
          CHECK

      - name: It refuses a device that is not there, rather than crashing
        run: |
          python - <<'CHECK'
          from z64kit import burn

          try:
              burn.read_device("nosuchdevice")
          except burn.DeviceError as refusal:
              print(f"refused as expected: {refusal}")
          else:
              print("::error title=No refusal::a missing device was accepted")
              raise SystemExit(1)
          CHECK

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.3.4 pytest-cov==6.0.0

      # The gate lives in pyproject.toml and nothing ran it, so the number was
      # free to drift for as long as nobody looked. It is only a gate once a job
      # fails on it.
      - name: Coverage must clear the gate in pyproject.toml
        run: python -m pytest -q -p no:randomly --cov --cov-report=term-missing

  distribution:
    name: The wheel carries no game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build it
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build

      # The whole claim of this project is that it identifies copyrighted files
      # rather than carrying them. That claim is worth checking mechanically on
      # every change rather than trusting a reviewer to notice.
      - name: Nothing copyrighted ships
        run: |
          python - <<'CHECK'
          import re
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          banned = re.compile(r"\.(z64|v64|n64|rom|aps|ips|zps|hdr|ram|eep|fla|sra|img|dat)$", re.I)
          found = [one for one in names if banned.search(one)]
          print(f"{len(names)} files in {wheel.name}")
          if found:
              print(f"::error title=Game data in the wheel::{', '.join(found)}")
              sys.exit(1)
          CHECK
        shell: bash
