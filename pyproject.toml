[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n64-mr-backup-z64-python"
dynamic = ["version"]
description = "Build verified Mr. Backup Z64 Zip 100 disk images and printable catalogues from an N64 ROM collection"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
keywords = ["nintendo64", "n64", "z64", "mr-backup", "zip100", "fat16", "retrocomputing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
z64kit = "z64kit.cli:main"

[project.urls]
Source = "https://github.com/gufranco/n64-mr-backup-z64-python"
Issues = "https://github.com/gufranco/n64-mr-backup-z64-python/issues"

[tool.hatch.version]
path = "src/z64kit/version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
# The video patcher lives in its own repository and arrives here as a submodule,
# so the wheel has to reach into it. A source archive of this repository carries
# that directory empty, which is why the readme says a recursive clone is the
# only way to get a working tree.
packages = ["src/z64kit", "n64-video-interface-python/src/n64_video_interface"]
# The tests sit beside the code, so they would ship without this.
exclude = ["*_test.py", "conftest.py"]

[tool.hatch.build.targets.sdist]
include = ["src/z64kit", "n64-video-interface-python/src/n64_video_interface", "tests", "README.md", "LICENSE.txt", "pyproject.toml"]
exclude = ["artifacts", "specs", "**/*.z64", "**/*.v64", "**/*.n64", "**/*.aps", "**/*.ips", "**/*.img"]

[tool.pytest.ini_options]
# Tests of a module sit beside it, as `<module>_test.py`. Tests of the repository
# itself, the documents, the workflows and the shell script, stay in tests/,
# because there is no module for them to sit beside. pytest already collects
# that name, and it is the one shape that does not collide: a file called
# `<module>.test.py` is imported as `<package>.<module>.test`, which turns
# `<package>.<module>` into a namespace package and shadows the module under
# test with an empty one.
testpaths = ["src", "tests"]
addopts = "-q --strict-markers --strict-config"
# So `pytest` works from a clean checkout with no environment set up. The second
# entry is the video patcher, which lives in its own repository and arrives as a
# submodule, so a tree without `--recurse-submodules` fails here first and says
# what is missing rather than failing later with an import nobody can place.
pythonpath = ["src", "n64-video-interface-python/src"]

[tool.coverage.run]
branch = true
source = ["src/z64kit"]
omit = ["*_test.py", "*/conftest.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The submodule is a repository with its own ruff configuration and its own CI
# job running it. Linting it from here would check somebody else's code against
# this project's settings and fail on a difference neither project is wrong
# about.
extend-exclude = ["n64-video-interface-python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
mypy_path = "n64-video-interface-python/src"
# Strict, plus the optional error classes the version offers. This code decides
# what lands on a disk and what a patch binds to, so a None or a width crossing a
# boundary it should not is exactly the class of defect worth catching before the
# bytes are written. The settings live here so a local run and CI agree.
strict = true
python_version = "3.11"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["src/z64kit"]
exclude = "(_test|conftest)\\.py$"

[[tool.mypy.overrides]]
# The tests build deliberately malformed inputs to prove the code refuses them,
# so they hand wrong types in on purpose. Checking them strictly would mean
# annotating a lie.
module = ["z64kit.*_test", "z64kit.conftest"]
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
"conftest.py" = ["S101"]
